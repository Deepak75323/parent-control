# ---------------------------
# Server
# ---------------------------
server.port=8080
server.servlet.context-path=/

# ---------------------------
# Spring core
# ---------------------------
spring.profiles.default=dev
spring.application.name=parental-control-api

# ---------------------------
# Kafka
# ---------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=pcp-monitoring-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ---------------------------
# Datasource / JPA / Flyway
# ---------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool sizing: rule of thumb = (2 x vCPU_count) + effective_disk_spindles.
# Adjust DB_POOL_MAX per replica so total connections <= PostgreSQL max_connections - 10.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:10000}
spring.datasource.hikari.pool-name=PcpHikariPool
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------
# App — security & platform
# ---------------------------
app.hmac.max-timestamp-skew-seconds=300
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.content-security-policy=${CSP_HEADER:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
app.admin.endpoints-enabled=${ADMIN_ENDPOINTS_ENABLED:false}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.password-reset-per-hour=${PASSWORD_RESET_RATE_LIMIT_PER_HOUR:3}
app.rate-limit.device-ingest-requests-per-minute=120
app.password-reset.enabled=${PASSWORD_RESET_ENABLED:true}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:15}
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE:}
app.email-verification.token-ttl-hours=${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
app.email-verification.verify-url-base=${EMAIL_VERIFICATION_URL_BASE:}
app.account-lockout.enabled=${ACCOUNT_LOCKOUT_ENABLED:true}
app.account-lockout.max-attempts=${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:5}
app.account-lockout.attempt-window-seconds=${ACCOUNT_LOCKOUT_ATTEMPT_WINDOW_SECONDS:900}
app.account-lockout.lock-duration-seconds=${ACCOUNT_LOCKOUT_LOCK_DURATION_SECONDS:900}
app.smtp.host=${SMTP_HOST:}
app.smtp.port=${SMTP_PORT:587}
app.smtp.username=${SMTP_USERNAME:}
app.smtp.password=${SMTP_PASSWORD:}
app.smtp.from-address=${SMTP_FROM:noreply@parentalcontrol.local}
app.billing.trial-days=14
app.billing.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe-price-standard=${STRIPE_PRICE_STANDARD:}
app.billing.stripe-price-family=${STRIPE_PRICE_FAMILY:}
app.billing.razorpay-enabled=${RAZORPAY_ENABLED:false}
app.encryption.key=${APP_ENCRYPTION_KEY:}
# Airtel-compatible AES-CBC JSON envelope — key/IV from env only (no defaults in source)
app.api-payload-encryption.enabled=${API_PAYLOAD_ENCRYPTION_ENABLED:false}
app.api-payload-encryption.key=${API_PAYLOAD_ENCRYPTION_KEY:}
app.api-payload-encryption.iv=${API_PAYLOAD_ENCRYPTION_IV:}
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.topic-notifications=pcp.monitoring.notifications
app.kafka.topic-location=pcp.monitoring.location
app.kafka.topic-usage-stats=pcp.monitoring.usage-stats
app.kafka.topic-heartbeat=pcp.monitoring.heartbeat

# ---------------------------
# App — WebRTC
# ---------------------------
app.webrtc.stun-urls[0]=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
app.webrtc.turn-username=${TURN_USERNAME:}
app.webrtc.turn-credential=${TURN_CREDENTIAL:}
app.webrtc.turn.secret=${TURN_SECRET:}
app.webrtc.turn.realm=${TURN_REALM:pcp}

# ---------------------------
# App — JWT
# ---------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.device-token-expiration-ms=${DEVICE_TOKEN_EXPIRATION_MS:2592000000}
app.jwt.issuer=parental-control-api

# ---------------------------
# App — STOMP / WebSocket broker
# ---------------------------
app.stomp.relay-enabled=${STOMP_RELAY_ENABLED:false}
app.stomp.cluster.mode=${STOMP_CLUSTER_MODE:local}
app.stomp.cluster.redis.channel=pcp:stomp:cluster
app.stomp.relay.port=${STOMP_RELAY_PORT:61614}
app.stomp.relay.system-login=${STOMP_RELAY_SYSTEM_LOGIN:guest}
app.stomp.relay.system-passcode=${STOMP_RELAY_SYSTEM_PASSCODE:guest}
app.stomp.relay.client-login=${STOMP_RELAY_CLIENT_LOGIN:guest}
app.stomp.relay.client-passcode=${STOMP_RELAY_CLIENT_PASSCODE:guest}
app.stomp.relay.user-destination-broadcast=/topic/unresolved-user-destination
app.stomp.relay.user-registry-broadcast=/topic/user-registry
app.stomp.relay.connect-timeout-ms=10000
app.stomp.relay.heartbeat-send-interval-ms=10000
app.stomp.relay.heartbeat-receive-interval-ms=10000
app.stomp.channel.inbound-core-pool-size=${STOMP_INBOUND_CORE_POOL:4}
app.stomp.channel.inbound-max-pool-size=${STOMP_INBOUND_MAX_POOL:16}
app.stomp.channel.inbound-queue-capacity=${STOMP_INBOUND_QUEUE:4096}
app.stomp.channel.outbound-core-pool-size=${STOMP_OUTBOUND_CORE_POOL:4}
app.stomp.channel.outbound-max-pool-size=${STOMP_OUTBOUND_MAX_POOL:16}
app.stomp.channel.outbound-queue-capacity=${STOMP_OUTBOUND_QUEUE:8192}

# ---------------------------
# App — device / child agent
# ---------------------------
app.fcm.enabled=${FCM_ENABLED:false}
app.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}
app.fcm.server-key=${FCM_SERVER_KEY:}
app.device-command.max-delivery-attempts=3
app.device-command.stale-delivered-seconds=300
app.device-command.stale-executed-awaiting-ack-seconds=3600
app.play-integrity.package-name=${PLAY_INTEGRITY_PACKAGE:com.childmonitor}
app.play-integrity.google-cloud-access-token=${GOOGLE_CLOUD_ACCESS_TOKEN:}
app.play-integrity.service-account-file=${PLAY_INTEGRITY_SERVICE_ACCOUNT_FILE:}
app.device-trust.min-pairing-score=${DEVICE_TRUST_MIN_PAIRING_SCORE:80}
app.device-trust.min-session-score=${DEVICE_TRUST_MIN_SESSION_SCORE:50}
app.device-trust.block-score=${DEVICE_TRUST_BLOCK_SCORE:20}
app.device-trust.nonce-max-age-seconds=${DEVICE_TRUST_NONCE_MAX_AGE_SECONDS:300}

# ---------------------------
# App — observability
# ---------------------------
app.observability.prometheus-public=${OBSERVABILITY_PROMETHEUS_PUBLIC:false}
app.observability.metrics-scrape-token=${METRICS_SCRAPE_TOKEN:}
app.observability.json-logging=${OBSERVABILITY_JSON_LOGGING:false}
app.observability.tracing-enabled=${OBSERVABILITY_TRACING_ENABLED:false}
app.observability.trace-sampling-probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
app.observability.gauge-refresh-ms=${OBSERVABILITY_GAUGE_REFRESH_MS:60000}

# ---------------------------
# Springdoc / Swagger (P2-02)
# Disabled by default — enable only in application-dev with ROLE_ADMIN auth.
# ---------------------------
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------
# Actuator / management
# ---------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.group.readiness.include=readinessState,db,redis
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:0.1}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.command.lag.seconds=true
management.metrics.distribution.percentiles-histogram.stream.start.latency.seconds=true
management.metrics.distribution.slo.command.lag.seconds=5s,30s,120s
management.metrics.distribution.slo.stream.start.latency.seconds=3s,10s,30s

# ---------------------------
# Chat media attachments
# ---------------------------
app.chat.attachments.storage-path=${CHAT_ATTACHMENTS_PATH:./data/chat-attachments}
app.chat.attachments.max-image-bytes=10485760
app.chat.attachments.max-video-bytes=52428800
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=56MB
