spring:
  application:
    name: parental-control-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pcp-monitoring-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parental_control}
    username: ${SPRING_DATASOURCE_USERNAME:pcp}
    password: ${SPRING_DATASOURCE_PASSWORD:pcp_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool sizing: rule of thumb = (2 × vCPU_count) + effective_disk_spindles.
      # Adjust DB_POOL_MAX per replica so total connections ≤ PostgreSQL max_connections - 10.
      # Example: 3 replicas × 30 = 90 connections → set max_connections=100 in PG.
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fail fast on pool exhaustion (30 s default is too slow for mobile heartbeats).
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:10000}
      pool-name: PcpHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080
  servlet:
    context-path: /

app:
  hmac:
    required: ${HMAC_REQUIRED:false}
    max-timestamp-skew-seconds: 300
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: 30
    device-ingest-requests-per-minute: 120
  billing:
    enforcement-enabled: ${BILLING_ENFORCEMENT:true}
    trial-days: 14
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    stripe-price-standard: ${STRIPE_PRICE_STANDARD:}
    stripe-price-family: ${STRIPE_PRICE_FAMILY:}
    checkout-success-url: ${CHECKOUT_SUCCESS_URL:http://localhost:8080/billing/success}
    checkout-cancel-url: ${CHECKOUT_CANCEL_URL:http://localhost:8080/billing/cancel}
  encryption:
    enabled: ${APP_ENCRYPTION_ENABLED:false}
    key: ${APP_ENCRYPTION_KEY:dev-only-change-in-production-32chars!!}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic-notifications: pcp.monitoring.notifications
    topic-location: pcp.monitoring.location
    topic-usage-stats: pcp.monitoring.usage-stats
    topic-heartbeat: pcp.monitoring.heartbeat
  webrtc:
    stun-urls:
      - ${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
    # Primary TURN server — all three entries are protocol variants of the same host.
    turn-urls:
      - turn:${TURN_EXTERNAL_HOST:127.0.0.1}:3478
      - turn:${TURN_EXTERNAL_HOST:127.0.0.1}:3478?transport=tcp
      - turns:${TURN_EXTERNAL_HOST:127.0.0.1}:5349?transport=tcp
    # Secondary TURN server — set TURN_EXTERNAL_HOST_2 for geographic redundancy/failover.
    # Leave empty to disable secondary. Both servers share the same TURN_SECRET.
    turn-urls-2: []
    turn-username: ${TURN_USERNAME:}
    turn-credential: ${TURN_CREDENTIAL:}
    turn:
      secret: ${TURN_SECRET:pcp_dev_turn_secret_32chars_minimum}
      realm: ${TURN_REALM:pcp}
      # 3600 s (1 h) — shorter TTL ensures TURN secret rotation takes effect within 1 h.
      # Previous default of 86400 s caused up to 24 h of streaming failures after rotation.
      credential-ttl-seconds: ${TURN_CREDENTIAL_TTL_SECONDS:3600}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-256-bit-minimum-secret-key!!}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    device-token-expiration-ms: ${DEVICE_TOKEN_EXPIRATION_MS:2592000000}
    issuer: parental-control-api
  websocket:
    # SEC1: In production set WEBSOCKET_ALLOWED_ORIGINS to your parent app origin(s).
    # Example: WEBSOCKET_ALLOWED_ORIGINS=https://parent.yourdomain.com,capacitor://localhost
    # The wildcard default is safe for development and native mobile apps (no Origin header),
    # but should be restricted in production to prevent CSRF on the SockJS /ws endpoint.
    allowed-origin-patterns:
      - ${WEBSOCKET_ALLOWED_ORIGINS:*}
  stomp:
    relay-enabled: ${STOMP_RELAY_ENABLED:false}
    cluster:
      mode: ${STOMP_CLUSTER_MODE:local}
      redis:
        channel: pcp:stomp:cluster
    relay:
      host: ${STOMP_RELAY_HOST:localhost}
      port: ${STOMP_RELAY_PORT:61614}
      system-login: ${STOMP_RELAY_SYSTEM_LOGIN:guest}
      system-passcode: ${STOMP_RELAY_SYSTEM_PASSCODE:guest}
      client-login: ${STOMP_RELAY_CLIENT_LOGIN:guest}
      client-passcode: ${STOMP_RELAY_CLIENT_PASSCODE:guest}
      user-destination-broadcast: /topic/unresolved-user-destination
      user-registry-broadcast: /topic/user-registry
      connect-timeout-ms: 10000
      heartbeat-send-interval-ms: 10000
      heartbeat-receive-interval-ms: 10000
    channel:
      # Queue capacity: set to ≥ 2× expected peak concurrent WebSocket connections.
      # Default 256 was sufficient only for dev; at 10k+ devices use 4096+.
      # Each queued item is ~2 KB; 4096 items ≈ 8 MB per channel — acceptable.
      inbound-core-pool-size: ${STOMP_INBOUND_CORE_POOL:4}
      inbound-max-pool-size: ${STOMP_INBOUND_MAX_POOL:16}
      inbound-queue-capacity: ${STOMP_INBOUND_QUEUE:4096}
      outbound-core-pool-size: ${STOMP_OUTBOUND_CORE_POOL:4}
      outbound-max-pool-size: ${STOMP_OUTBOUND_MAX_POOL:16}
      outbound-queue-capacity: ${STOMP_OUTBOUND_QUEUE:8192}
  fcm:
    enabled: ${FCM_ENABLED:false}
    service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
    server-key: ${FCM_SERVER_KEY:}
  device-command:
    max-delivery-attempts: 3
    stale-delivered-seconds: 300
    stale-executed-awaiting-ack-seconds: 3600
  security:
    # Require parent PIN (step-up) for sensitive device commands:
    # TAP, SWIPE, TYPE_TEXT, LAUNCH_APP, ENABLE_KIOSK, DISABLE_KIOSK, REVOKE_MONITORING.
    # Off by default for developer setups; production profile enables it.
    remote-control-pin-required: ${REMOTE_CONTROL_PIN_REQUIRED:false}
  play-integrity:
    required: ${PLAY_INTEGRITY_REQUIRED:false}
    package-name: ${PLAY_INTEGRITY_PACKAGE:com.childmonitor}
    google-cloud-access-token: ${GOOGLE_CLOUD_ACCESS_TOKEN:}
    service-account-file: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_FILE:}
    require-play-recognized: ${PLAY_INTEGRITY_REQUIRE_PLAY_RECOGNIZED:false}
    require-strong-integrity: ${PLAY_INTEGRITY_REQUIRE_STRONG_INTEGRITY:false}
  device-trust:
    enforcement-enabled: ${DEVICE_TRUST_ENFORCEMENT:false}
    min-pairing-score: ${DEVICE_TRUST_MIN_PAIRING_SCORE:80}
    min-session-score: ${DEVICE_TRUST_MIN_SESSION_SCORE:50}
    block-score: ${DEVICE_TRUST_BLOCK_SCORE:20}
    nonce-max-age-seconds: ${DEVICE_TRUST_NONCE_MAX_AGE_SECONDS:300}
  observability:
    prometheus-public: ${OBSERVABILITY_PROMETHEUS_PUBLIC:false}
    metrics-scrape-token: ${METRICS_SCRAPE_TOKEN:}
    json-logging: ${OBSERVABILITY_JSON_LOGGING:false}
    tracing-enabled: ${OBSERVABILITY_TRACING_ENABLED:false}
    trace-sampling-probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
    gauge-refresh-ms: ${OBSERVABILITY_GAUGE_REFRESH_MS:60000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    group:
      readiness:
        include: readinessState,db,redis
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        command.lag.seconds: true
        stream.start.latency.seconds: true
      slo:
        command.lag.seconds: 5s,30s,120s
        stream.start.latency.seconds: 3s,10s,30s

# Tamper protection — admin master password for setup/dev only; disable in production.
tamper:
  master-pin:
    enabled: ${TAMPER_MASTER_PIN_ENABLED:true}
    pin: ${TAMPER_MASTER_PIN:Deepak@123}

logging:
  level:
    com.parentalcontrol: INFO
    org.springframework.security: WARN
