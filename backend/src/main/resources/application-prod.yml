# Production profile — enable strict device HMAC verification.
spring:
  config:
    activate:
      on-profile: prod

tamper:
  master-pin:
    enabled: false

app:
  security:
    # Production: always require parent PIN for sensitive remote-control commands.
    remote-control-pin-required: ${REMOTE_CONTROL_PIN_REQUIRED:true}
  hmac:
    required: true
  encryption:
    enabled: true
  fcm:
    enabled: ${FCM_ENABLED:true}
  play-integrity:
    required: ${PLAY_INTEGRITY_REQUIRED:true}
    service-account-file: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_FILE:}
    require-play-recognized: ${PLAY_INTEGRITY_REQUIRE_PLAY_RECOGNIZED:true}
  device-trust:
    enforcement-enabled: ${DEVICE_TRUST_ENFORCEMENT:true}
    min-pairing-score: ${DEVICE_TRUST_MIN_PAIRING_SCORE:80}
    min-session-score: ${DEVICE_TRUST_MIN_SESSION_SCORE:50}
  observability:
    json-logging: true
    tracing-enabled: ${OBSERVABILITY_TRACING_ENABLED:true}
    metrics-scrape-token: ${METRICS_SCRAPE_TOKEN:}
  websocket:
    allowed-origin-patterns:
      - ${WEBSOCKET_ALLOWED_ORIGINS:https://app.parentalcontrol.local}
  webrtc:
    turn-urls:
      - turn:${TURN_EXTERNAL_HOST:turn.parentalcontrol.local}:3478
      - turn:${TURN_EXTERNAL_HOST:turn.parentalcontrol.local}:3478?transport=tcp
      - turns:${TURN_EXTERNAL_HOST:turn.parentalcontrol.local}:5349?transport=tcp
    turn:
      secret: ${TURN_SECRET}
      realm: ${TURN_REALM:pcp}
      credential-ttl-seconds: ${TURN_CREDENTIAL_TTL_SECONDS:86400}
  stomp:
    relay-enabled: false
    cluster:
      mode: redis
    relay:
      host: ${STOMP_RELAY_HOST:rabbitmq}
      port: ${STOMP_RELAY_PORT:61613}
      system-login: ${STOMP_RELAY_SYSTEM_LOGIN:pcp}
      system-passcode: ${STOMP_RELAY_SYSTEM_PASSCODE:pcp_secret}
      client-login: ${STOMP_RELAY_CLIENT_LOGIN:pcp}
      client-passcode: ${STOMP_RELAY_CLIENT_PASSCODE:pcp_secret}

management:
  health:
    group:
      readiness:
        include: readinessState,db,redis
