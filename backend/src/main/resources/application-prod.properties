# Production profile — strict security defaults. Missing env vars fail at startup.
spring.config.activate.on-profile=prod

# ---------------------------
# Server
# ---------------------------
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------
# Datasource
# ---------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ---------------------------
# Tamper (disabled in prod)
# ---------------------------
tamper.master-pin.enabled=false

# ---------------------------
# App — billing & auth
# ---------------------------
app.billing.enforcement-enabled=true
app.billing.checkout-success-url=${CHECKOUT_SUCCESS_URL}
app.billing.checkout-cancel-url=${CHECKOUT_CANCEL_URL}
app.security.remote-control-pin-required=${REMOTE_CONTROL_PIN_REQUIRED:true}
app.hmac.required=true
app.encryption.enabled=true
app.api-payload-encryption.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.content-security-policy=${CSP_HEADER:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
app.admin.endpoints-enabled=false
app.rate-limit.enabled=true
app.rate-limit.auth-requests-per-minute=5
app.rate-limit.auth-email-requests-per-minute=10
app.rate-limit.password-reset-per-hour=3
app.rate-limit.fail-closed=true
app.account-lockout.enabled=true
app.account-lockout.fail-closed=true
app.password-reset.enabled=true
app.password-reset.token-ttl-minutes=15
app.password-reset.reset-url-base=${PASSWORD_RESET_URL_BASE}
app.email-verification.enforcement-enabled=true
app.email-verification.token-ttl-hours=24
app.email-verification.verify-url-base=${EMAIL_VERIFICATION_URL_BASE}
app.smtp.host=${SMTP_HOST}
app.smtp.port=${SMTP_PORT:587}
app.smtp.username=${SMTP_USERNAME}
app.smtp.password=${SMTP_PASSWORD}
app.smtp.from-address=${SMTP_FROM}

# ---------------------------
# App — device / child agent
# ---------------------------
app.fcm.enabled=${FCM_ENABLED:true}
app.play-integrity.required=${PLAY_INTEGRITY_REQUIRED:true}
app.play-integrity.service-account-file=${PLAY_INTEGRITY_SERVICE_ACCOUNT_FILE:}
app.play-integrity.require-play-recognized=${PLAY_INTEGRITY_REQUIRE_PLAY_RECOGNIZED:true}
app.device-trust.enforcement-enabled=${DEVICE_TRUST_ENFORCEMENT:true}
app.device-trust.min-pairing-score=${DEVICE_TRUST_MIN_PAIRING_SCORE:80}
app.device-trust.min-session-score=${DEVICE_TRUST_MIN_SESSION_SCORE:50}

# ---------------------------
# App — WebRTC / WebSocket
# ---------------------------
app.websocket.allowed-origin-patterns[0]=${WEBSOCKET_ALLOWED_ORIGINS}
app.webrtc.turn-urls[0]=turn:${TURN_EXTERNAL_HOST}:3478
app.webrtc.turn-urls[1]=turn:${TURN_EXTERNAL_HOST}:3478?transport=tcp
app.webrtc.turn-urls[2]=turns:${TURN_EXTERNAL_HOST}:5349?transport=tcp
app.webrtc.turn.secret=${TURN_SECRET}
app.webrtc.turn.realm=${TURN_REALM:pcp}
app.webrtc.turn.credential-ttl-seconds=${TURN_CREDENTIAL_TTL_SECONDS:3600}

# ---------------------------
# App — STOMP cluster
# ---------------------------
app.stomp.relay-enabled=false
app.stomp.cluster.mode=redis
app.stomp.relay.host=${STOMP_RELAY_HOST:rabbitmq}
app.stomp.relay.port=${STOMP_RELAY_PORT:61613}
app.stomp.relay.system-login=${STOMP_RELAY_SYSTEM_LOGIN:}
app.stomp.relay.system-passcode=${STOMP_RELAY_SYSTEM_PASSCODE:}
app.stomp.relay.client-login=${STOMP_RELAY_CLIENT_LOGIN:}
app.stomp.relay.client-passcode=${STOMP_RELAY_CLIENT_PASSCODE:}

# ---------------------------
# App — observability
# ---------------------------
app.observability.json-logging=true
app.observability.tracing-enabled=${OBSERVABILITY_TRACING_ENABLED:true}
app.observability.prometheus-public=false
app.observability.metrics-scrape-token=${METRICS_SCRAPE_TOKEN:}

# ---------------------------
# Springdoc (disabled in prod)
# ---------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------
# Actuator
# ---------------------------
management.health.group.readiness.include=readinessState,db,redis
