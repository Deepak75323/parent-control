# Local development profile — relaxed security defaults. Never use in production.
spring.config.activate.on-profile=dev

# ---------------------------
# Infra (local defaults)
# ---------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parental_control}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pcp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ---------------------------
# Tamper (dev only)
# ---------------------------
tamper.master-pin.enabled=${TAMPER_MASTER_PIN_ENABLED:false}
tamper.master-pin.pin=${TAMPER_MASTER_PIN:}

# ---------------------------
# App — relaxed security
# ---------------------------
app.hmac.required=${HMAC_REQUIRED:false}
app.rate-limit.auth-requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:30}
app.rate-limit.fail-closed=${RATE_LIMIT_FAIL_CLOSED:false}
# P2-02: OpenAPI available locally for admins (SecurityConfig requires ROLE_ADMIN).
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
app.billing.enforcement-enabled=${BILLING_ENFORCEMENT:false}
app.billing.checkout-success-url=${CHECKOUT_SUCCESS_URL:http://localhost:8080/billing/success}
app.billing.checkout-cancel-url=${CHECKOUT_CANCEL_URL:http://localhost:8080/billing/cancel}
app.email-verification.enforcement-enabled=${EMAIL_VERIFICATION_REQUIRED:false}
app.encryption.enabled=${APP_ENCRYPTION_ENABLED:false}
app.security.remote-control-pin-required=${REMOTE_CONTROL_PIN_REQUIRED:false}
app.play-integrity.required=${PLAY_INTEGRITY_REQUIRED:false}
app.play-integrity.require-play-recognized=${PLAY_INTEGRITY_REQUIRE_PLAY_RECOGNIZED:false}
app.play-integrity.require-strong-integrity=${PLAY_INTEGRITY_REQUIRE_STRONG_INTEGRITY:false}
app.device-trust.enforcement-enabled=${DEVICE_TRUST_ENFORCEMENT:false}
app.websocket.allowed-origin-patterns[0]=${WEBSOCKET_ALLOWED_ORIGINS:*}
app.webrtc.turn-urls[0]=turn:${TURN_EXTERNAL_HOST:127.0.0.1}:3478
app.webrtc.turn-urls[1]=turn:${TURN_EXTERNAL_HOST:127.0.0.1}:3478?transport=tcp
app.webrtc.turn-urls[2]=turns:${TURN_EXTERNAL_HOST:127.0.0.1}:5349?transport=tcp
app.webrtc.turn.credential-ttl-seconds=${TURN_CREDENTIAL_TTL_SECONDS:3600}
app.stomp.relay.host=${STOMP_RELAY_HOST:localhost}

# ---------------------------
# Tracing / logging
# ---------------------------
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.level.com.parentalcontrol=INFO
logging.level.org.springframework.security=WARN
