global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: parental-control-api
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8080']
    # Bearer token for /actuator/prometheus — set via METRICS_SCRAPE_TOKEN in .env and
    # configure credentials in your deployment (Prometheus does not expand env vars in YAML).
    # Leave authorization unset when OBSERVABILITY_PROMETHEUS_PUBLIC=true (local dev only).

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
