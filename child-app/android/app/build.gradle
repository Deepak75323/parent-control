apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn(
        'google-services.json missing — FCM disabled. ' +
        'Copy google-services.json.example or run ./scripts/dev/install-google-services.sh'
    )
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseConfigured = releaseStoreFile != null && !releaseStoreFile.isEmpty()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.childmonitor"
    defaultConfig {
        applicationId "com.childmonitor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseConfigured) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: ""
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: ""
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (isReleaseBuild && !releaseConfigured) {
        throw new GradleException(
            'Release build requires RELEASE_STORE_FILE and signing env vars — no debug fallback'
        )
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("io.getstream:stream-webrtc-android:1.1.3")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-messaging")
    implementation("androidx.work:work-runtime-ktx:2.9.1")
    implementation("com.google.android.play:integrity:1.4.0")
    def cameraxVersion = "1.4.1"
    implementation("androidx.camera:camera-core:$cameraxVersion")
    implementation("androidx.camera:camera-camera2:$cameraxVersion")
    implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")
    testImplementation("androidx.test:core:1.6.1")

    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.2")
}

// Native screen capture uses stream-webrtc-android; JS uses react-native-webrtc.
// Both ship org.webrtc — keep Stream's AAR and drop Jitsi's duplicate.
configurations.configureEach {
    exclude group: "org.jitsi", module: "webrtc"
}
