name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile
      - name: Set up Podman for Testcontainers
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman system service --time=0 unix:///tmp/podman.sock &
          echo "DOCKER_HOST=unix:///tmp/podman.sock" >> $GITHUB_ENV
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV
      - name: Test (requires Podman for Testcontainers)
        run: mvn -B test
