name: Parent App CI

on:
  push:
    branches: [main, develop]
    paths: ['parent-app/**', '.github/workflows/parent-app-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['parent-app/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: parent-app/package-lock.json
      - run: npm ci
      - run: npm run lint
