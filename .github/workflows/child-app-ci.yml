name: Child App CI

on:
  push:
    branches: [main, develop]
    paths: ['child-app/**', '.github/workflows/child-app-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['child-app/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: child-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: child-app/package-lock.json
      - run: npm ci
      - run: npm run lint
