# Parental Control App — nginx site for Oracle / single-VM staging.
# Applied by: scripts/deploy/oracle-apply-nginx.sh
#
# Design notes:
# - worker_connections are raised in nginx.conf (events block) by the apply script.
# - Separate zones for HTTP vs WebSocket so reconnect storms on /ws-native do not
#   share a tiny nested limit_conn (that returned HTTP 503 instead of 101).
# - WebSocket locations keep long read timeouts; plain API uses short connect timeout.
# - /portal/ serves the parent web SPA (same origin as /api and /ws — no CORS).

limit_conn_zone $binary_remote_addr zone=pcp_conn:10m;
limit_conn_zone $binary_remote_addr zone=pcp_ws:10m;

# Active backend port (8080 or 8081) — updated by scripts/deploy/oracle-swap-backend.sh
upstream pcp_backend {
    include /etc/nginx/pcp-backend-upstream.conf;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Chat video ≤50 MiB and library PDFs ≤100 MiB (+ multipart overhead).
    client_max_body_size 112m;

    # Soft cap per IP for HTTP API.
    limit_conn pcp_conn 128;

    # Parent web portal (static Vite build in /var/www/portal/)
    location = /portal {
        return 301 /portal/;
    }

    location /portal/ {
        root /var/www;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://pcp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass http://pcp_backend/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://pcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws-native {
        proxy_pass http://pcp_backend/ws-native;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # One device = 1–2 live sockets; allow headroom for reconnect storms.
        limit_conn pcp_ws 32;
    }

    location /ws {
        proxy_pass http://pcp_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn pcp_ws 32;
    }

    location /ws/ {
        proxy_pass http://pcp_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn pcp_ws 32;
    }
}
