{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-api
  labels:
    app: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 4318
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
{{- if .Values.coturn.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-turn
  labels:
    app: {{ .Chart.Name }}-turn
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}-turn
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: UDP
          port: 3478
        - protocol: TCP
          port: 3478
        - protocol: TCP
          port: 5349
        {{- range untilStep (int .Values.coturn.relayMinPort) (add (int .Values.coturn.relayMaxPort) 1) 1 }}
        - protocol: UDP
          port: {{ . }}
        {{- end }}
  egress:
    - ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
{{- end }}
{{- end }}
