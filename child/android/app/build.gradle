apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn(
        'google-services.json missing — FCM disabled. ' +
        'Copy google-services.json.example or run ./scripts/dev/install-google-services.sh'
    )
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE")
def releaseConfigured = releaseStoreFile != null && !releaseStoreFile.isEmpty()

// Certificate pinning — injected at build time via CI env vars.
// Debug builds leave these empty so developers can use local servers / proxies freely.
// Release builds MUST supply all four variables (enforced below in taskGraph.whenReady).
//
// How to generate SPKI pins:
//   openssl s_client -connect <host>:443 </dev/null 2>/dev/null \
//     | openssl x509 -pubkey -noout \
//     | openssl pkey -pubin -outform DER \
//     | openssl dgst -sha256 -binary \
//     | base64
//
// Use the leaf cert for CERT_PIN_PRIMARY.
// Use the issuing CA or a pre-generated next-leaf cert for CERT_PIN_BACKUP so that
// leaf rotation does not require an emergency app update.
def certHost          = System.getenv("CERT_HOST")           ?: ""
def certPinPrimary    = System.getenv("CERT_PIN_PRIMARY")    ?: ""
def certPinBackup     = System.getenv("CERT_PIN_BACKUP")     ?: ""
def certPinExpiration = System.getenv("CERT_PIN_EXPIRATION") ?: "2027-07-01"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.childmonitor"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.childmonitor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Certificate pinning — empty in debug, real values in release via CI env vars
        buildConfigField "String", "CERT_HOST",          "\"${certHost.replace("\"", "\\\"")}\""
        buildConfigField "String", "CERT_PIN_PRIMARY",   "\"${certPinPrimary.replace("\"", "\\\"")}\""
        buildConfigField "String", "CERT_PIN_BACKUP",    "\"${certPinBackup.replace("\"", "\\\"")}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseConfigured) {
                storeFile file(releaseStoreFile)
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: ""
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: ""
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any { it.name.toLowerCase().contains('release') }

    if (isReleaseBuild && !releaseConfigured) {
        throw new GradleException(
            'Release build requires RELEASE_STORE_FILE and signing env vars — no debug fallback'
        )
    }

    if (isReleaseBuild) {
        // P1-02: master PIN must never be embedded in release APKs — reject at build time.
        def tamperPinEnv = System.getenv("TAMPER_MASTER_PIN") ?: ""
        if (!tamperPinEnv.trim().isEmpty()) {
            throw new GradleException(
                "Release build rejected: TAMPER_MASTER_PIN must not be set. " +
                "Tamper verification is server-side only — no client-side master PIN."
            )
        }

        // Validate cert pinning vars — fail fast in CI rather than shipping a broken config.
        if (certHost.isEmpty()) {
            throw new GradleException(
                "Release build requires CERT_HOST env var (e.g. api.example.com, no scheme or port)."
            )
        }
        if (certPinPrimary.isEmpty()) {
            throw new GradleException(
                "Release build requires CERT_PIN_PRIMARY env var.\n" +
                "Generate with: openssl s_client -connect ${certHost}:443 </dev/null 2>/dev/null \\\n" +
                "  | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER \\\n" +
                "  | openssl dgst -sha256 -binary | base64"
            )
        }
        if (certPinBackup.isEmpty()) {
            throw new GradleException(
                "Release build requires CERT_PIN_BACKUP env var (intermediate CA or pre-rotated leaf pin)."
            )
        }

        // Generate the release network_security_config.xml from env vars so the XML in
        // source control never contains placeholder values in a deployed APK.
        def nscDir = file("src/release/res/xml")
        nscDir.mkdirs()
        def nscFile = new File(nscDir, "network_security_config.xml")
        nscFile.text = """\
<?xml version="1.0" encoding="utf-8"?>
<!--
  Generated by build.gradle — do not edit manually.
  Source of truth: CERT_HOST / CERT_PIN_PRIMARY / CERT_PIN_BACKUP / CERT_PIN_EXPIRATION env vars.
  Regenerated on every release build.
-->
<network-security-config>
    <!-- Reject all cleartext traffic globally. -->
    <base-config cleartextTrafficPermitted="false">
        <trust-anchors>
            <certificates src="system" />
        </trust-anchors>
    </base-config>

    <!--
      Certificate pinning for the production API host.
      Both pins are required at validation time (primary OR backup must match).
      The backup pin covers the next leaf or issuing CA, enabling zero-downtime
      leaf rotation without a forced app update.
    -->
    <domain-config>
        <domain includeSubdomains="true">${certHost}</domain>
        <pin-set expiration="${certPinExpiration}">
            <pin digest="SHA-256">${certPinPrimary}</pin>
            <pin digest="SHA-256">${certPinBackup}</pin>
        </pin-set>
    </domain-config>
</network-security-config>
"""
        logger.lifecycle("Generated release network_security_config.xml for host=${certHost} expiration=${certPinExpiration}")
    }
}

// P1-02: Post-release scan — fail CI if forbidden secret markers appear in the APK.
tasks.register("verifyReleaseApkNoSecrets") {
    group = "verification"
    description = "Scans release APK for embedded master PIN markers (P1-02 guard)."
    dependsOn("assembleRelease")
    doLast {
        def apkDir = file("${buildDir}/outputs/apk/release")
        def apks = fileTree(apkDir) { include("*.apk") }.files
        if (apks.isEmpty()) {
            throw new GradleException("No release APK found in ${apkDir}")
        }
        def forbidden = [
            "TAMPER_MASTER_PIN",
            "TamperDevBypass",
            "REPLACE_WITH_BASE64_SPKI_PIN",
        ]
        apks.each { apk ->
            def zip = new java.util.zip.ZipFile(apk)
            try {
                zip.entries().each { entry ->
                    if (!entry.name.endsWith(".dex") && !entry.name.endsWith(".json")) return
                    def bytes = zip.getInputStream(entry).bytes
                    def text = new String(bytes, "ISO-8859-1")
                    forbidden.each { marker ->
                        if (text.contains(marker)) {
                            throw new GradleException(
                                "Release APK ${apk.name} contains forbidden marker '${marker}' " +
                                "(entry ${entry.name}). Remove embedded secrets before shipping."
                            )
                        }
                    }
                }
            } finally {
                zip.close()
            }
        }
        logger.lifecycle("verifyReleaseApkNoSecrets: OK — no forbidden secret markers in ${apks.size()} APK(s)")
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("io.getstream:stream-webrtc-android:1.1.3")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-messaging")
    implementation("androidx.work:work-runtime-ktx:2.9.1")
    implementation("com.google.android.play:integrity:1.4.0")
    def cameraxVersion = "1.4.1"
    implementation("androidx.camera:camera-core:$cameraxVersion")
    implementation("androidx.camera:camera-camera2:$cameraxVersion")
    implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")
    testImplementation("androidx.test:core:1.6.1")

    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.2")
}

// Native screen capture uses stream-webrtc-android; JS uses react-native-webrtc.
// Both ship org.webrtc — keep Stream's AAR and drop Jitsi's duplicate.
configurations.configureEach {
    exclude group: "org.jitsi", module: "webrtc"
}
